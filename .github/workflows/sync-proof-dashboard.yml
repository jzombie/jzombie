name: sync-proof-dashboard
on:
  schedule:
    # After jzombie-graph nightly (04:17 UTC) — offset off the top of the hour.
    - cron: "47 5 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: sync-proof-dashboard
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: jzombie/jzombie-graph
          ref: main
          path: .source
          sparse-checkout: |
            proof/README.md
            proof/charts
            proof/indicators
      - uses: jzombie/rust-oxdock@main
        with:
          product: oxdock
      - name: sync vendored dashboard
        run: |
          oxdock <<'EOF'
          WORKSPACE LOCAL
          RUN ["cp", ".source/proof/README.md", "README.md"]
          RUN ["rm", "-rf", "charts", "indicators"]
          RUN ["cp", "-R", ".source/proof/charts", "charts"]
          RUN ["cp", "-R", ".source/proof/indicators", "indicators"]
          RUN ["rm", "-rf", ".source"]
          RUN ["git", "config", "user.name", "github-actions[bot]"]
          RUN ["git", "config", "user.email", "github-actions[bot]@users.noreply.github.com"]
          RUN ["git", "add", "README.md", "charts", "indicators"]
          RUN ["sh", "-c", "git diff --cached --quiet || git commit -m 'sync proof dashboard from jzombie-graph'"]
          RUN ["git", "push"]
          EOF
