name: sync-proof-dashboard
on:
  schedule:
    # Exactly one hour after the jzombie-graph nightly (04:17 UTC).
    - cron: "17 5 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: sync-proof-dashboard
  cancel-in-progress: false
# Temp-file DSL steps resolve the workspace through this, never
# through the script path: GitHub stages `run:` blocks outside the
# checkout, so discovery would misresolve without the override.
env:
  OXDOCK_WORKSPACE_ROOT: ${{ github.workspace }}
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: jzombie/jzombie-graph
          ref: main
          path: .source
          # Fragments stay behind: they are build inputs oxdock-render
          # consumed, not assets the profile embeds.
          sparse-checkout: |
            proof/README.md
            proof/dashboard/charts
            proof/dashboard/indicators
      - uses: jzombie/rust-oxdock@main
        with:
          product: oxdock
      - name: sync vendored dashboard
        shell: oxdock --script {0}
        run: |
          IMPORT [STD]
          INHERIT_ENV [GITHUB_WORKSPACE]
          WORKSPACE SYSTEM
          WORKDIR {{ env:GITHUB_WORKSPACE }}
          COPY .source/proof/README.md README.md
          LET $dashboard_kind: STRING = PATH_TYPE("dashboard")
          IF $dashboard_kind != "absent" {
            REMOVE --recursive dashboard
          }
          COPY .source/proof/dashboard dashboard
          REMOVE --recursive .source
          RUN ["git", "config", "user.name", "github-actions[bot]"]
          RUN ["git", "config", "user.email", "github-actions[bot]@users.noreply.github.com"]
          # -A stages everything (added, modified, deleted) with no
          # pathspec: picks up the legacy dir removals above and never
          # fatals on a path that no longer exists.
          RUN ["git", "add", "-A"]
          RUN ["sh", "-c", "git diff --cached --quiet || git commit -m 'sync proof dashboard from jzombie-graph'"]
          RUN ["git", "push"]
